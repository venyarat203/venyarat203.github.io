<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbingle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
        }

        header a {
            margin-left: 15px;
            text-decoration: none;
            color: #3c4043;
            font-size: 13px;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Main Content Container */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
        }

        /* Brand Title styling */
        .brand-title {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #4285f4;
        }

        /* Centered Search Box Container */
        .search-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 10px 20px;
            transition: box-shadow 0.2s;
        }

        .search-container:hover, .search-container:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: transparent;
        }

        .search-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #202124;
        }

        /* Buttons Styling */
        .button-container {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            transition: border 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* Bottom Footer bar */
        footer {
            background-color: #f2f2f2;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            border-top: 1px solid #dadce0;
        }

        footer a {
            text-decoration: none;
            color: #70757a;
            font-size: 14px;
            margin-right: 15px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="#link">Mail</a>
        <a href="#link">Images</a>
        <a href="#link" style="font-weight: bold;">Profile</a>
    </header>

    <main>
        <div class="brand-title">Garbingle</div>
        
        <div class="search-container">
            <input type="text" class="search-input" aria-label="Search field" autofocus>
        </div>

        <div class="button-container">
            <button class="btn">Search the Web</button>
            <button class="btn">Random Page</button>
        </div>
    </main>

    <footer>
        <div class="footer-left">
            <a href="#link">About</a>
            <a href="#link">Advertising</a>
            <a href="#link">Business</a>
        </div>
        <div class="footer-right">
            <a href="#link">Privacy</a>
            <a href="#link">Terms</a>
            <a href="#link">Settings</a>
        </div>
    </footer>

</body>
</html>
