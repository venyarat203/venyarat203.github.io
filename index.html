<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Example</title>
    <style>
        /* Center everything and set a solid white background */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* White background */
            overflow: hidden;
        }

        /* Style the image and apply the infinite rotation animation */
        .rotating-image {
            width: 300px; /* Adjust size as needed */
            height: auto;
            /* 
               - "spin" is the keyframe name
               - "10s" is the duration (change to speed up or slow down)
               - "linear" keeps the rotation speed constant
               - "infinite" makes it loop forever
            */
            animation: spin 10s linear infinite; 
        }

        /* Define the 360-degree rotation animation steps */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Replace the src URL with your local image file or online image link -->
    <img class="rotating-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRt1JRwTY093KvLhMuKh-HhonWqbyPiuhxQ5Q&s" alt="Rotating Artwork">

</body>
</html>
